name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Run the CI checks first
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install project with dev dependencies
        run: pip install ".[dev]"

      - name: Run tests
        run: pytest -v

  # Build the Windows executable
  build-windows:
    name: Build Windows .exe
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install ".[build]"

      - name: Build executable
        run: pyinstaller twistnshrink.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: twistnshrink-windows
          path: dist/twistnshrink.exe

  # Create the GitHub Release with attached assets
  create-release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: twistnshrink-windows
          path: release-assets

      - name: List files in release-assets
        run: ls -R release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/twistnshrink.exe
